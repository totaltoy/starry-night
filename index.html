        if (i === lastIdx) i = (i + 1 + ((Math.random() * 3) | 0)) % SCALE.length;
        lastIdx = i;
        pluck(SCALE[i], rand(0.6, 1.0));
        // 偶尔补一个上方或下方的音，形成很短的两音动机
        if (Math.random() < 0.35) {
          const j = Math.max(0, Math.min(SCALE.length - 1,
            i + (Math.random() < 0.5 ? 1 : 2) * (Math.random() < 0.7 ? 1 : -1)));
          later(() => pluck(SCALE[j], rand(0.4, 0.7)), rand(700, 2200));
        }
        later(phrase, rand(14000, 42000));
      };
      later(phrase, rand(2500, 6000));
    }

    /* ---------- 海浪：两个 LFO 同时扫音量与截止频率 ---------- */
    function waves(ctx, out) {
      const bed = ctx.createGain();
      bed.gain.value = 0.22;                       // 基准；LFO 会把它推到峰值附近
      const sw1 = ctx.createGain();
      sw1.gain.value = 1;
      bed.connect(sw1).connect(out);
      lfo(ctx, 0.075, 0.52, sw1.gain);             // 慢潮涌
      lfo(ctx, 0.113, 0.16, sw1.gain);             // 叠加一个不同周期，避免机械感

      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 520;
      f.Q.value = 0.9;
      lfo(ctx, 0.075, 300, f.frequency);           // 浪峰时高频更亮
      f.connect(bed);
      loopNoise(ctx, brownBuffer(ctx, 9)).connect(f);

      // 浪尖的细碎白噪：另走一路带通，音量更小、周期错开
      const foam = ctx.createGain();
      foam.gain.value = 0.05;
      const sw2 = ctx.createGain();
      sw2.gain.value = 1;
      foam.connect(sw2).connect(out);
      lfo(ctx, 0.075, 0.9, sw2.gain);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2100;
      bp.Q.value = 0.7;
      loopNoise(ctx, pinkBuffer(ctx, 7)).connect(bp).connect(foam);
    }

    /* ---------- 篝火：闷响铺底 + 随机爆裂 ---------- */
    function fire(ctx, out) {
      const rumble = ctx.createBiquadFilter();
      rumble.type = 'lowpass';
      rumble.frequency.value = 240;
      rumble.Q.value = 0.5;
      lfo(ctx, 0.16, 70, rumble.frequency);
      rumble.connect(out);
      const rg = ctx.createGain();
      rg.gain.value = 0.44;          // 同上，给限幅留出余量
      rg.connect(rumble);
      loopNoise(ctx, brownBuffer(ctx, 7)).connect(rg);

      const crackle = () => {
        if (!ac || ac.state !== 'running') return;
        const t0 = ac.currentTime + Math.random() * 0.25;
        const g = ac.createGain();
        const peak = Math.random() < 0.12 ? rand(0.11, 0.2) : rand(0.025, 0.09);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(peak, t0 + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + rand(0.03, 0.16));
        const bp = ac.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = rand(1500, 4600);
        bp.Q.value = rand(1.2, 3.4);
        const s = ac.createBufferSource();
        s.buffer = pinkBuffer(ac, 1);
        s.loop = true;
        s.connect(bp).connect(g).connect(out);
        s.start(t0);
        s.stop(t0 + 0.25);
      };
      const fireLoop = () => {
        // 成簇出现：几声挨得近，然后安静一会儿
        const burst = 1 + ((Math.random() * 4) | 0);
        for (let i = 0; i < burst; i++) later(crackle, i * rand(28, 90));
        later(fireLoop, rand(120, 700));
      };
      fireLoop();
      // 偶尔来一声大一点的「啪」
      every(() => { if (Math.random() < 0.5) later(crackle, rand(0, 300)); }, 6500);
    }

    /* ---------- 森林夜：风声 + 虫鸣 ---------- */
    function forest(ctx, out) {
      const wind = ctx.createGain();
      wind.gain.value = 0.20;
      lfo(ctx, 0.05, 0.16, wind.gain);
      lfo(ctx, 0.087, 0.07, wind.gain);
      wind.connect(out);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 900;
      lp.connect(wind);
      loopNoise(ctx, brownBuffer(ctx, 8)).connect(lp);

      const chirp = () => {
        if (!ac || ac.state !== 'running') return;
        const t0 = ac.currentTime + Math.random() * 0.2;
        const base = rand(3600, 5200);
        const n = 2 + ((Math.random() * 3) | 0);
        for (let i = 0; i < n; i++) {
          const st = t0 + i * rand(0.07, 0.15);
          const o = ac.createOscillator();
          o.type = 'triangle';
          o.frequency.setValueAtTime(base, st);
          o.frequency.exponentialRampToValueAtTime(base * rand(1.02, 1.12), st + 0.05);
          const g = ac.createGain();
          g.gain.setValueAtTime(0, st);
          g.gain.linearRampToValueAtTime(rand(0.012, 0.03), st + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, st + 0.12);
          o.connect(g).connect(out);
          o.start(st);
          o.stop(st + 0.16);
        }
      };
      const forestLoop = () => {
        chirp();
        if (Math.random() < 0.4) later(chirp, rand(500, 1400));
        later(forestLoop, rand(1800, 5500));
      };
      later(forestLoop, rand(800, 2500));
    }

    // 供自动化检查读取（见 .test/audio-check）：不改运行时行为
    const SCAPES_SRC = { drone, rain, waves, fire, forest, piano };
    /* 响度归一化系数。
       来源：用假 AudioContext 记录每个声景的节点图，
       按「各源 RMS² × 路径增益² 求和后开方」估算相对响度，
       目标取各声景的中位数，补偿限制在 ±3 倍以内
       （不取最轻的当基准 —— 那样会把雨和篝火压到几乎听不见，抹掉声景性格）。
       琴偏轻是刻意的：稀疏音符的感知响度本就低。 */
    /* 深空刻意取补偿上限 3.0：它现在是「只留微光」，本就该远轻于其他声景
       （微光峰值 0.033，其他声景约 0.21）。但颂钵同样被这个系数乘到 0.089，
       所以那一声钟依然清楚 —— 轻的是底噪，不是钟。 */
    const TRIM = { drone: 3.0, rain: 0.51, waves: 0.94, fire: 0.48, forest: 1.06, piano: 3.0 };

    const SCAPES = {
      drone:  { label: '深空',   build: drone  },
      rain:   { label: '雨',     build: rain   },
      waves:  { label: '海浪',   build: waves  },
      fire:   { label: '篝火',   build: fire   },
      forest: { label: '森林夜', build: forest },
      piano:  { label: '琴',     build: piano  },
    };

    /* ---------- 生命周期 ---------- */
    function teardown() {
      clearTimers();
      if (!scape) return;
      try { scape.gain.gain.cancelScheduledValues(ac.currentTime); } catch { /* 忽略 */ }
      try { scape.gain.disconnect(); } catch { /* 忽略 */ }
      try { if (scape.trim) scape.trim.disconnect(); } catch { /* 忽略 */ }
      scape = null;
    }

    function build(key) {
      const def = SCAPES[key];
      if (!def) return false;
      teardown();
      const g = ac.createGain();
      g.gain.value = 1;
      // 声景各自的响度补偿，夹在声景输出与主控之间
      const trim = ac.createGain();
      trim.gain.value = TRIM[key] != null ? TRIM[key] : 1;
      g.connect(trim).connect(master);
      def.build(ac, g);
      scape = { key, gain: g, trim };
      currentKey = key;
      return true;
    }

    const fade = (target, seconds) => {
      const now = ac.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(target, now + seconds);
    };

    return {
      get available() {
        return !!(window.AudioContext || window.webkitAudioContext);
      },
      get isOn() { return on; },
      get current() { return currentKey; },
      get scapes() { return Object.entries(SCAPES).map(([k, v]) => ({ key: k, label: v.label })); },
      // 仅供自动化检查读取各声景的构建函数，运行时逻辑不依赖它
      get _src() { return SCAPES_SRC; },
      // 供 ?diag=1 面板显示当前音频状态
      _diag() {
        return {
          ctx: ac ? ac.state : '(未创建)',
          on,
          key: currentKey || '(无)',
          scapes: Object.keys(SCAPES).length,
          master: master ? master.gain.value.toFixed(3) : '-',
          vol: (this._vol == null ? 0.7 : this._vol).toFixed(2),
          limiter: !!(master && master.numberOfOutputs != null && ac && ac.createDynamicsCompressor),
        };
      },

      // 开启 / 关闭。key 省略则沿用当前声景（默认第一个）
      async toggle(want, key, volume) {
        if (starting) return on;
        starting = true;
        try {
          if (!ac) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return false;
            ac = new AC();
            master = ac.createGain();
            master.gain.value = 0;
            // 软限幅：仅在接近满刻度时压缩，平时完全不介入
            if (ac.createDynamicsCompressor) {
              const limiter = ac.createDynamicsCompressor();
              limiter.threshold.value = -6;
              limiter.knee.value = 6;
              limiter.ratio.value = 12;
              limiter.attack.value = 0.003;
              limiter.release.value = 0.25;
              master.connect(limiter).connect(ac.destination);
            } else {
              master.connect(ac.destination);
            }
          }
          if (ac.state === 'suspended') await ac.resume();
        } finally {
          starting = false;
        }

        const target = typeof want === 'boolean' ? want : !on;
        if (volume != null) this.setVolume(volume);

        if (target) {
          const k = key || currentKey || 'drone';
          if (k !== currentKey) build(k);
          else if (!scape) build(k);
          // 被截断时给一个下限，避免峰值削顶
          fade(this._peak(), 3.2);
          on = true;
        } else {
          fade(0, 1.8);
          on = false;
          // 淡出结束后再拆节点，避免尾巴被硬切
          later(() => { if (!on) teardown(); }, 2200);
        }
        return on;
      },

      setVolume(v01) {
        this._vol = clamp(v01, 0, 1);
        if (on && master) fade(this._peak(), 0.35);
      },
      get volume() { return this._vol == null ? 0.7 : this._vol; },

      _vol: 0.7,
      // 用平方曲线：滑杆小幅度时变化细腻，符合听感
      _peak() {
        const v = this._vol == null ? 0.7 : this._vol;
        return MASTER_PEAK * v * v;
      },

      async select(key) {
        if (!on) return this.toggle(true, key);
        fade(0, 1.3);
        await new Promise((r) => later(r, 1400));
        build(key);
        fade(this._peak(), 1.6);
        return true;
      },
    };
  })();


  /* ---------- 呼吸引导 ---------- */
  const Breath = (() => {
    const orb = document.getElementById('orb');
    const label = document.getElementById('breathText');
    if (!orb || !label) return { setCalm() {} };

    // 4-7-8：吸气 4s / 屏息 7s / 呼气 8s
    // 这里只给出「相位 + 时长」，具体的缩放/亮度全部写在 CSS 里 ——
    // 星尘土星的每个部件（环、星点、球面、核心）各自的过渡曲线不同，
    // 用 JS 统一设 transitionDuration 会覆盖掉子元素的时长，反而不对。
    const PHASES = [
      { key: 'in', txt: '慢慢吸气', ms: 4000 },
      { key: 'hold', txt: '轻轻停住', ms: 7000 },
      { key: 'out', txt: '缓缓呼出', ms: 8000 },
    ];
    let i = 0, timer = 0, idleTimer = 0, engaged = false;

    function apply(phase) {
      // --dur 让整组部件共用同一个节奏；子元素用它作为过渡时长
      orb.style.setProperty('--dur', phase.ms + 'ms');
      orb.dataset.phase = phase.key;      // 触发 CSS 里的相位样式
      label.textContent = phase.txt;
    }

    function tick() {
      i = (i + 1) % PHASES.length;
      apply(PHASES[i]);
      timer = setTimeout(tick, PHASES[i].ms);
    }

    // 前 14 秒保持邀请语，之后自动进入呼吸节奏
    function start() {
      if (engaged) return;
      engaged = true;
      i = -1;
      tick();
    }

    idleTimer = setTimeout(start, 14000);

    return {
      // 用户交互过就立刻开始
      engage() {
        if (!engaged) {
          clearTimeout(idleTimer);
          engaged = true;
          i = -1;
          tick();
        }
      },
      setCalm(on) {
        clearTimeout(timer);
        if (on) {
          label.textContent = '什么都不用做，只要在这里';
          orb.style.setProperty('--dur', '1400ms');
          orb.dataset.phase = 'idle';
          engaged = true;
        } else {
          engaged = false;
          i = -1;
          tick();
        }
      },
    };
  })();

  /* ---------- 控件 ---------- */
  /* ---------- 声音控件 ----------
     主开关负责「开/关」，面板负责「听什么 / 多大声 / 听多久」。
     设定（声景、音量、定时）存 localStorage，下次打开就沿用。 */
  const soundBtn = document.getElementById('soundBtn');
  const soundPanel = document.getElementById('soundPanel');
  const sndItems = [...document.querySelectorAll('.snd-item')];
  const sndVol = document.getElementById('sndVol');
  const sndTimer = document.getElementById('sndTimer');
  const sndNote = document.getElementById('sndNote');
  const calmBtn = document.getElementById('calmBtn');
  const quietNote = document.getElementById('quietNote');

  const PREF = (() => {
    try { return JSON.parse(localStorage.getItem('starry.pref') || '{}') || {}; }
    catch { return {}; }
  })();
  const savePref = (patch) => {
    try { localStorage.setItem('starry.pref', JSON.stringify({ ...PREF, ...patch })); }
    catch { /* 隐私模式下写不了，忽略 */ }
  };

  let timerId = 0;

  const setSoundLabel = (isOn, key) => {
    const lbl = soundBtn && soundBtn.querySelector('.btn-label');
    if (!lbl) return;
    const name = (Sound.scapes.find((s) => s.key === key) || {}).label;
    lbl.textContent = isOn ? (name ? name + '声' : '关闭环境音') : '开启环境音';
  };

  const markCurrent = (key) => {
    sndItems.forEach((el) => el.setAttribute('aria-checked', String(el.dataset.scape === key)));
  };

  const note = (text) => {
    if (!sndNote) return;
    if (text) { sndNote.textContent = text; sndNote.hidden = false; }
    else { sndNote.hidden = true; sndNote.textContent = ''; }
  };

  const applySound = async (want, key) => {
    const ok = await Sound.toggle(want, key);
    soundBtn.setAttribute('aria-pressed', String(ok));
    soundBtn.classList.toggle('is-on', ok);
    setSoundLabel(ok, Sound.current || key);
    return ok;
  };

  if (soundBtn && soundPanel && !Sound.available) {
    soundBtn.hidden = true;
    soundPanel.hidden = true;
  }

  if (soundBtn && soundPanel) {
    if (sndVol) sndVol.value = String(Math.round(Sound.volume * 100));
    if (PREF.scape) markCurrent(PREF.scape);

    soundBtn.addEventListener('click', async () => {
      const open = soundBtn.getAttribute('aria-expanded') === 'true';
      soundBtn.setAttribute('aria-expanded', String(!open));
      soundPanel.hidden = open;
      if (!open) markCurrent(Sound.current || PREF.scape || 'drone');
      Breath.engage();
    });

    sndItems.forEach((el) => {
      el.addEventListener('click', async () => {
        const key = el.dataset.scape;
        markCurrent(key);
        savePref({ scape: key });
        await Sound.select(key);
        soundBtn.setAttribute('aria-pressed', 'true');
        soundBtn.classList.add('is-on');
        setSoundLabel(true, key);
        if (timerId) startTimer(Number(sndTimer.value));   // 换声景时重置倒计时
      });
    });

    if (sndVol) {
      sndVol.addEventListener('input', () => {
        const v = Number(sndVol.value) / 100;
        Sound.setVolume(v);
        savePref({ vol: v });
      });
      // 面板打开时同步一次（可能被别处改过）
      soundBtn.addEventListener('click', () => {
        sndVol.value = String(Math.round(Sound.volume * 100));
      });
    }

    const startTimer = (minutes) => {
      clearTimeout(timerId);
      timerId = 0;
      note('');
      if (!minutes) { savePref({ timer: 0 }); return; }
      savePref({ timer: minutes });
      const endAt = Date.now() + minutes * 60000;
      // 到点前 20 秒开始淡出，收尾更柔和
      const fadeAt = Math.max(0, endAt - Date.now() - 20000);
      timerId = setTimeout(async () => {
        if (Sound.isOn) {
          note('正在淡出…');
          await applySound(false);
        }
        note('定时已结束，声音停止。');
        if (sndTimer) sndTimer.value = '0';
        savePref({ timer: 0 });
        timerId = 0;
      }, fadeAt);
      const when = new Date(endAt);
      note(`将在 ${when.getHours()}:${String(when.getMinutes()).padStart(2, '0')} 淡出停止。`);
    };

    if (sndTimer) {
      sndTimer.addEventListener('change', () => {
        const m = Number(sndTimer.value) || 0;
        if (m && !Sound.isOn) applySound(true, Sound.current || PREF.scape || 'drone');
        startTimer(m);
      });
    }
  }


  if (calmBtn) {
    calmBtn.addEventListener('click', () => {
      state.calm = !state.calm;
      calmBtn.setAttribute('aria-pressed', String(state.calm));
      calmBtn.classList.toggle('is-on', state.calm);
      document.body.classList.toggle('is-calm', state.calm);
      if (quietNote) quietNote.hidden = !state.calm;
      const lbl = calmBtn.querySelector('.btn-label');
      if (lbl) lbl.textContent = state.calm ? '回到星空' : '更安静一点';
      Breath.setCalm(state.calm);
      if (state.calm) state.meteors.length = 0;
    });
  }

  // 任意首次交互 → 呼吸引导进入节奏
  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => {
    window.addEventListener(ev, () => Breath.engage(), { once: true, passive: true });
  });

  // 光标光晕跟随（独立于 canvas 帧率）
  (function glowLoop() {
    if (glow) {
      glowX += (glowTX - glowX) * 0.12;
      glowY += (glowTY - glowY) * 0.12;
      glow.style.setProperty('--gx', glowX.toFixed(1) + 'px');
      glow.style.setProperty('--gy', glowY.toFixed(1) + 'px');
      if (pointerActive && glow.style.opacity !== '1') glow.style.opacity = '1';
    }
    requestAnimationFrame(glowLoop);
  })();

  REDUCED.addEventListener?.('change', () => {
    resize();
  });

  // 测试用：把内部对象暴露出来，便于自动化检查分层贡献（页面上不会用到）
  if (typeof globalThis !== 'undefined' && globalThis.__EXPOSE__) {
    globalThis.__DSH_INTERNALS__ = { neb, galaxy, state, Sound, seedStars, seedBandStars, seedDust, resize, drawStars, drawNebula, frame };
  }

  /* ---------- 诊断模式（仅 ?diag=1 时启用，不影响正常使用）----------
     浏览器里的实际布局值只有浏览器自己知道。与其靠推理，不如把它显示出来。 */
  if (typeof location !== 'undefined' && /[?&]diag=1/.test(location.search)) {
    const box = document.createElement('pre');
    box.style.cssText = [
      'position:fixed', 'left:8px', 'bottom:8px', 'z-index:99',
      'margin:0', 'padding:10px 12px', 'border-radius:8px',
      'background:rgba(0,0,0,.82)', 'color:#cfe0ff',
      'font:11px/1.7 ui-monospace,Menlo,monospace',
      'white-space:pre', 'pointer-events:none',
    ].join(';');
    document.body.appendChild(box);
    const stage = document.getElementById('stage');
    const sky = document.getElementById('sky');
    const orb = document.getElementById('orb');
    const read = () => {
      const cs = getComputedStyle(document.documentElement);
      const vw = window.innerWidth;
      const sr = stage.getBoundingClientRect();
      const sk = sky.getBoundingClientRect();
      const or = orb.getBoundingClientRect();
      const t = document.getElementById('breathText');
      const meta = document.querySelector('meta[name="starry-build"]');
      const build = meta ? meta.getAttribute('content') : '(无)';
      const d = Sound._diag();
      box.textContent = [
        `建构版本  ${build}`,
        `声景      已注册 ${d.scapes} 种   当前 ${d.key}   开关 ${d.on ? '开' : '关'}`,
        `音频      ctx=${d.ctx}  master=${d.master}  音量=${d.vol}  限幅=${d.limiter ? '有' : '无'}`,
        `视口      ${vw} × ${window.innerHeight}   dpr=${window.devicePixelRatio}`,
        `--scale   ${cs.getPropertyValue('--scale').trim()}`,
        `--sky-scale ${cs.getPropertyValue('--sky-scale').trim()}`,
        `内容块     ${sr.width.toFixed(1)} × ${sr.height.toFixed(1)}   占屏 ${(sr.width / vw * 100).toFixed(1)}%`,
        `实测缩放   ${scaleState.scale.toFixed(3)}   （星空 ${scaleState.skyScale.toFixed(3)}）`,
        `computed   ${getComputedStyle(stage).transform}`,
        `  位置     left=${sr.left.toFixed(1)}  top=${sr.top.toFixed(1)}`,
        `星空       ${sk.width.toFixed(1)} × ${sk.height.toFixed(1)}`,
        `呼吸土星   ${or.width.toFixed(1)} × ${or.height.toFixed(1)}   占内容宽 ${(or.width / sr.width * 100).toFixed(1)}%`,
        `标题字号   ${getComputedStyle(document.querySelector('.title')).fontSize}`,
        `正文       ${getComputedStyle(t).fontSize}`,
        `（把这几行发我即可）`,
      ].join('\n');
    };
    read();
    let raf2 = 0;
    window.addEventListener('resize', () => { cancelAnimationFrame(raf2); raf2 = requestAnimationFrame(read); });
  }

  /* ---------- 构图缩放（JS 直接写数值）----------
     为什么不用 CSS：zoom: var(--scale) 与 transform: scale(var(--scale))
     在实测中都被浏览器忽略（诊断面板里「内容块 540.0」正好等于 CSS 写死的宽度，
     说明缩放根本没发生）。与其继续和 CSS 变量解析规则纠缠，
     不如把算好的数字直接写进 style —— 没有歧义。
     系数 = 目标渲染宽 / 构图基准宽；下限 0.75 保证小屏正文不小于约 12px。 */
  const COMPOSE_W = 540;
  const scaleState = { scale: 1, skyScale: 1 };
  // 与 CSS 里的断点保持一致：窄屏走正常流式布局，不做整页缩放
  const MOBILE_MAX = 900;
  function applyComposeScale() {
    const vw = window.innerWidth || 1280;
    const stage = document.getElementById('stage');
    const sky = document.getElementById('sky');

    if (vw <= MOBILE_MAX) {
      // 手机上必须取消 transform：否则布局宽(540)大于视口宽，
      // 浏览器会把整页缩小显示，正文变成 6~9px、按钮高 17px。
      if (stage) {
        stage.style.transform = '';
        stage.style.transformOrigin = '';
        stage.style.marginBottom = '';
      }
      if (sky) sky.style.transform = 'translateZ(0)';
      scaleState.scale = 1;
      scaleState.skyScale = 1;
      return;
    }

    const scale = Math.min(4, Math.max(1, (vw * 0.5) / COMPOSE_W));
    if (stage) {
      stage.style.transform = 'scale(' + scale + ')';
      stage.style.transformOrigin = 'top left';
      // transform 不参与布局：用负边距把缩放后多出来的空间收掉
      stage.style.marginBottom = 'calc(100svh * ' + (scale - 1) + ')';
    }
    // 星空跟随放大，但上限小一些（可视面积变大会增加合成开销）
    // 双指缩放叠加在基础缩放之上：state.skyZoom 由手势写入（1 表示未缩放）
    const base = Math.min(1.32, Math.max(1, vw / 900));
    const skyScale = base * (state.skyZoom || 1);
    if (sky) {
      sky.style.transform = 'scale(' + skyScale.toFixed(4) + ') translateZ(0)';
      sky.style.transformOrigin = '50% 50%';
    }
    scaleState.scale = scale;
    scaleState.skyScale = skyScale;
  }
  let scaleRaf = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(scaleRaf);
    scaleRaf = requestAnimationFrame(applyComposeScale);
  });

  /* ---------- 启动 ---------- */
  resize();
  applyComposeScale();          // 按视口算好构图缩放，直接写进 style
  requestAnimationFrame(frame);
  // 开场的两颗流星，作为「欢迎」
  setTimeout(() => spawnMeteor(true), 1400);
  setTimeout(() => spawnMeteor(false), 4200);
})();
</script>
</body>
</html>
